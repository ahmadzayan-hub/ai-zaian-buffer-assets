name: Content Quality Gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed validator tests
        run: python scripts/TestContentRelease.py
